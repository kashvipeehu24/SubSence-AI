<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyzing | SubSense AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --bg: #07111f;
        --text: #f4f7fb;
        --muted: #92a7c0;
        --accent: #4f8cff;
        --accent-2: #63e4c0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #07111f, #101d33);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .loading-card {
        width: min(100%, 560px);
        background: rgba(15, 27, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 2.2rem;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .spinner {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.12);
        border-top-color: var(--accent-2);
        animation: spin 0.9s linear infinite;
      }

      .progress {
        height: 10px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.4s ease;
      }

      .text-muted {
        color: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading-card">
      <div class="spinner"></div>
      <h2 class="fw-bold mt-4">Analyzing your financial activity</h2>
      <p class="text-muted" id="loadingMessage">Preparing your report...</p>

      <div class="progress mt-4">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p class="small text-muted mt-3" id="loadingStep">Scanning Transactions...</p>
    </div>

    <script>
      const steps = [
        'Scanning Transactions...',
        'Finding Recurring Payments...',
        'Detecting Hidden Subscriptions...',
        'Analyzing Financial Leaks...',
        'Calculating Financial Health...',
        'Generating AI Recommendations...',
        'Preparing Dashboard...'
      ];

      const progressBar = document.getElementById('progressBar');
      const loadingStep = document.getElementById('loadingStep');
      const loadingMessage = document.getElementById('loadingMessage');

      let progress = 0;
      const interval = setInterval(() => {
        progress += 14;
        if (progress > 100) progress = 100;
        progressBar.style.width = progress + '%';

        const index = Math.min(Math.floor(progress / 14), steps.length - 1);
        loadingStep.textContent = steps[index];

        if (progress === 100) {
          clearInterval(interval);
          loadingMessage.textContent = 'Analysis complete. Redirecting...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 700);
        }
      }, 500);
    </script>
  </body>
</html>
